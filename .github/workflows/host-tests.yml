name: Host tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install game and watchface phone test dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix watchface --ignore-scripts
      - name: Rules and 20,000-seed fairness simulation
        run: ./tools/test.sh
      - name: Address and undefined-behavior sanitizers
        run: ./tools/test.sh --sanitize
